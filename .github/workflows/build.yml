name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # dmg only: upload-artifact zips a bare .app and strips exec bits/symlinks, breaking it
          - platform: macos-latest
            bundles: src-tauri/target/release/bundle/dmg/*.dmg
            release_files: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
            release_files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          # native Arch build in a container; the deb gets repackaged by makepkg
          - platform: ubuntu-latest
            container: archlinux:base-devel
            artifact: arch
            build_args: --bundles deb
            bundles: packaging/arch/*.pkg.tar.zst
            release_files: packaging/arch/*.pkg.tar.zst

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}

    steps:
      # before checkout so it runs in git mode instead of falling back to the REST API
      - name: Install Arch dependencies
        if: matrix.container
        run: pacman -Syu --noconfirm git zstd webkit2gtk-4.1 openssl appmenu-gtk-module libayatana-appindicator librsvg xdotool file

      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.build_args }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Build Arch package
        if: matrix.container
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/bundle/deb/*.deb packaging/arch/email.deb
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" packaging/arch/PKGBUILD
          useradd -m builder
          chown -R builder packaging/arch
          cd packaging/arch
          runuser -u builder -- makepkg --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: email-${{ matrix.artifact || matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

      - name: Attach bundles to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.release_files }}
          draft: true
          fail_on_unmatched_files: true
          body: |
            ## macOS install
            The app is not notarized. After copying it to Applications, clear the quarantine flag:
            ```
            xattr -cr /Applications/Email.app
            ```
