name: Release

# Bumps the version, commits, tags, and pushes — same as running
# scripts/release.sh locally. The tag push then triggers build.yml.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Tags pushed with the default GITHUB_TOKEN don't trigger other
      # workflows (GitHub's anti-recursion rule), so build.yml would never
      # run. RELEASE_TOKEN must be a PAT with contents: write.
      - name: Require RELEASE_TOKEN
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::RELEASE_TOKEN secret not set; the tag would not trigger the build workflow. Add a PAT with contents:write."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run release script
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release.sh "$VERSION"
