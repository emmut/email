name: macOS update verification

on:
  pull_request:
    paths:
      - .github/workflows/build-macos.yml
      - .github/workflows/macos-update-check.yml
      - scripts/*macos*.sh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    # Keep the Apple Silicon build on a fixed image instead of the latest migration.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      # A small signed fixture tests codesign and DMG verification; no Rust build.
      - name: Accept sealed updates and reject modified bundles
        run: bash scripts/test-macos-update.sh
