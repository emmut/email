name: Release

# Bumps the version, commits, tags, pushes, and builds — same as running
# scripts/release.sh locally, except the tag pushed here (with GITHUB_TOKEN)
# can't trigger build.yml, so this workflow calls it directly instead.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, no leading v (e.g. 0.1.1)"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, tag, push
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/release.sh "$VERSION"

  build:
    needs: tag
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ inputs.version }}
    secrets: inherit
