name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# One run per PR/branch; a new push cancels the in-flight run to save minutes.
# main/tag pushes are never cancelled — they publish artifacts/releases.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast fail: typecheck frontend + backend before the expensive bundle builds.
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm exec tsc --noEmit

      - name: Frontend tests
        run: pnpm exec vitest run

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  # Create the release once, up front. When each matrix job created it on demand,
  # jobs finishing at the same time raced: one created a duplicate release for the
  # tag and its assets were dropped when GitHub discarded the duplicate.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: |
            ## macOS install
            The app is not notarized. After copying it to Applications, clear the quarantine flag:
            ```
            xattr -cr /Applications/Email.app
            ```
        run: |
          if ! gh release view "$GITHUB_REF_NAME" &>/dev/null; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --notes "$RELEASE_NOTES"
          fi

  build:
    needs: create-release
    # create-release is skipped on non-tag refs; only bail if it actually failed
    if: ${{ !cancelled() && needs.create-release.result != 'failure' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # dmg only: upload-artifact zips a bare .app and strips exec bits/symlinks, breaking it
          - platform: macos-latest
            bundles: src-tauri/target/release/bundle/dmg/*.dmg
            release_files: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            bundles: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
            release_files: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage
          # native Arch build in a container; the deb gets repackaged by makepkg
          - platform: ubuntu-latest
            container: archlinux:base-devel
            artifact: arch
            build_args: --bundles deb
            bundles: packaging/arch/*.pkg.tar.zst
            release_files: packaging/arch/*.pkg.tar.zst

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}

    steps:
      # before checkout so it runs in git mode instead of falling back to the REST API
      - name: Install Arch dependencies
        if: matrix.container
        run: pacman -Syu --noconfirm git github-cli zstd webkit2gtk-4.1 openssl appmenu-gtk-module libayatana-appindicator librsvg xdotool file

      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Single-source the app version from the release tag: bundle filenames,
      # in-app version, Sparkle comparisons, and the Arch pkgver all read it
      # from tauri.conf.json.
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = './src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          " "${GITHUB_REF_NAME#v}"

      - name: Build Tauri app
        run: pnpm tauri build ${{ matrix.build_args }}
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}

      - name: Build Arch package
        if: matrix.container
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          cp src-tauri/target/release/bundle/deb/*.deb packaging/arch/email.deb
          # pacman pkgver forbids hyphens: 0.0.9-alpha -> 0.0.9_alpha
          sed -i "s/^pkgver=.*/pkgver=${VERSION//-/_}/" packaging/arch/PKGBUILD
          useradd -m builder
          chown -R builder packaging/arch
          cd packaging/arch
          runuser -u builder -- makepkg --noconfirm

      - uses: actions/upload-artifact@v7
        with:
          name: email-${{ matrix.artifact || matrix.platform }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

      - name: Attach bundles to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_FILES: ${{ matrix.release_files }}
        # failglob makes an unmatched pattern an error instead of a silent skip
        run: |
          shopt -s failglob
          gh release upload "$GITHUB_REF_NAME" $RELEASE_FILES --clobber

      # Personal pacman repo: publish the package plus a repo database to the
      # rolling `arch-repo` release, so machines with that repo in pacman.conf
      # pick up new versions via plain `pacman -Syu` (see README, "Updates").
      # The release is a prerelease so it can never become the repo's "latest"
      # release — Sparkle's SUFeedURL depends on releases/latest pointing at
      # the newest v* release.
      - name: Publish to pacman repo
        if: startsWith(github.ref, 'refs/tags/v') && matrix.artifact == 'arch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s failglob
          mkdir pacman-repo
          cp packaging/arch/*.pkg.tar.zst pacman-repo/
          cd pacman-repo
          # Fresh db each release: only the newest version is installable via
          # pacman; older packages stay attached to arch-repo for manual
          # downgrades.
          repo-add email.db.tar.gz *.pkg.tar.zst
          # pacman fetches plain email.db / email.files; repo-add only leaves
          # symlinks with those names, and symlinks don't survive the upload
          cp --remove-destination email.db.tar.gz email.db
          cp --remove-destination email.files.tar.gz email.files
          if ! gh release view arch-repo &>/dev/null; then
            gh release create arch-repo --prerelease --latest=false \
              --title "Arch package repository" \
              --notes "Rolling pacman repository, updated by CI on every release. See the README's Updates section for pacman.conf setup."
          fi
          gh release upload arch-repo *.pkg.tar.zst email.db email.files --clobber

      # Sparkle in-app updates: sign the dmg and attach an appcast to the
      # release. SUFeedURL in Info.plist points at
      # releases/latest/download/appcast.xml. Runs after the dmg upload so the
      # appcast never advertises an enclosure that isn't downloadable yet.
      - name: Attach Sparkle appcast to release
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY secret not set; skipping Sparkle appcast (in-app updates won't see this release)"
            exit 0
          fi
          shopt -s failglob
          dmgs=(src-tauri/target/release/bundle/dmg/*.dmg)
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/${GH_REPO}/releases/download/${GITHUB_REF_NAME}/$(basename "${dmgs[0]}")"
          scripts/generate-appcast.sh "${dmgs[0]}" "$VERSION" "$URL" appcast.xml
          gh release upload "$GITHUB_REF_NAME" appcast.xml --clobber
